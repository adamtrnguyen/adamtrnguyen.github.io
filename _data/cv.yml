    Experience:
      - company: Responsible Data Science Lab (ReDS), Virginia Tech
        position: Undergraduate LLM Researcher
        location: Blacksburg, VA
        url: https://reds-lab.github.io/
        start_date: 2023-10
        end_date: 2026-06
        summary: >-
          Research with Prof. Ruoxi Jia. Contributed across 6 ML and LLM
          research projects, 3 resulting in papers, spanning agentic data
          curation, data selection, and LLM memorization and safety.
        highlights:
          - "Curation-Bench (EMNLP 2026): benchmark of whether generalist coding agents can curate training data, with training and evaluation held fixed so that the data is the only thing that changes. Found that agents could match published data-selection methods while mostly making small, weakly justified changes to the data."
          - Built a curation agent on AutoGen, then ran Claude Code and Codex as a baseline. Saw both invent quality formulas without seeking evidence, but proposed rerunning them more freely because the fixed pipeline might have constrained them.
          - Reviewed transcripts from three custom agent designs and saw agents act against their own correct conclusions and damage datasets. Redesigned the agent as a planner and executor with separate phases for hypotheses, exploration, and implementation.
          - Retired the custom harnesses on advisor guidance when the research question shifted to whether existing agent harnesses could curate data.
          - Co-developed the benchmark's Docker agent loop and data-access environment, and scaled agent runs across multiple GPUs with Ray on Virginia Tech's HPC cluster to produce the paper's evaluations.
          - "Retracing the Past (EMNLP 2025): testing whether confusing an LLM makes it emit memorized training data. Prompts optimized to confuse Llama 2 70B drew out exact training text for 22.2% of prompts, against 10.8% for random prompts."
          - Reproduced the prior repeat-word extraction attack on Llama 2 70B, then tested it across the model's vocabulary and tracked token probabilities as the model broke away from repeating.
          - Fine-tuned aligned LLMs with LoRA on 1,998 questions paired with unrelated answers, to undo the alignment that keeps them from emitting memorized training data.
          - Built a pipeline to download, tokenize and index RedPajama, an open stand-in for Llama's unknown training data, with suffix arrays in C++, so model outputs could be searched for memorized text. Later switched to Infini-gram's hosted index.

      - company: Amazon Nova AI Challenge (HokieTokie Team)
        position: Team Research Engineer
        location: Seattle, WA — collaboration with Amazon AGI; Ruoxi Jia, VT PI
        url: https://www.amazon.science/amazon-nova-ai-challenge-trusted-ai
        start_date: 2024-11
        end_date: 2025-06
        highlights:
          - Co-led Tournament 3's two-model fusion after refusal models underperformed on secure-code tests; a refusal expert screened requests before a separate model generated code.
          - Built the team's AWS Lambda handler and served vLLM inference behind it from Docker containers on EC2 p5 H100 instances, then moved deployment to an Amazon S3 bucket and Amazon Bedrock.
          - Cut evaluation runtime 6×, from 2 hours to 20 minutes, via concurrency and async, and built an AWS Bedrock deployment pipeline that cut model deployment 8×, from 2 hours to 15 minutes.
          - Curated adversarial multi-turn training data with Claude 3.7 Sonnet for the team's 45,239-example Python-vulnerability set, used in the SFT and DPO runs on its internal 8B code model.

