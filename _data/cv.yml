    Experience:
      - company: Responsible Data Science Lab (ReDS), Virginia Tech
        position: Undergraduate Researcher
        location: Blacksburg, VA
        url: https://reds-lab.github.io/
        start_date: 2023-10
        end_date: present
        summary: >-
          Research with Prof. Ruoxi Jia on data-centric AI. Contributed across
          6 ML and LLM research projects (3 resulting in papers), spanning HPC
          training infrastructure, agentic data curation, data valuation, and
          LLM memorization and safety.
        highlights:
          - Built concurrent Python inference pipelines for 4+ LLMs, running experiments on the lab H100 cluster and Virginia Tech HPC.
          - Engineered a distributed (Ray on Slurm) inference and training pipeline to sweep training and evaluation across many model configurations.
          - Authored Slurp, a Slurm/Ray TUI and CLI for HPC job management, GPU monitoring, resource reporting, and Ray task tracking. Lifted experiment throughput from about 1 run per meeting to 30 to 90+ configurations per meeting.
          - Built and maintained a PostgreSQL-backed research pipeline storing results, scaling data, and origin metadata for reproducible querying.
          - Designed evaluation using LLM-as-judge scoring, ablations, clustering metrics, BM25 similarity, and perplexity-based proxies; contributed post-training (SFT) and inference experiments to the EMNLP 2025 paper.
          - Co-authored Curation-Bench, where LLM coding agents iteratively curate data, fine-tune models, and revise against fixed train/eval feedback across 8 vision-language benchmarks.
          - Primary systems administrator for the lab's compute infrastructure, coordinating with university HPC staff.

      - company: Amazon Nova AI Challenge (HokieTokie Team)
        position: Team Research Engineer
        location: Seattle, WA — collaboration with Amazon AGI Science; VT PI Ruoxi Jia
        url: https://www.amazon.science/amazon-nova-ai-challenge-trusted-ai
        start_date: 2024-11
        end_date: 2025-06
        highlights:
          - Optimized evaluation pipelines via concurrency and async processing, cutting runtime from 2 hours to 20 minutes (6x).
          - Managed AWS infrastructure on a $150K/month research budget across 8 months; built a shared-drive architecture that lifted team throughput 5x.
          - Built an AWS Bedrock deployment pipeline that cut model deployment time from 2 hours to 15 minutes (8x).
          - Built the SFT and DPO training environment for an internal 7B code model and generated adversarial training data to reduce unsafe-code generation and improve refusal of malicious requests; supported vLLM inference on Docker and Kubernetes (AWS p5/H100). Published in the Amazon Nova AI Challenge proceedings.

      - company: Raytheon Technologies
        position: Software Engineering Intern
        location: Richardson, TX
        start_date: 2024-05
        end_date: 2024-08
        summary: >-
          Selected as 1 of 20 students for the VT-Raytheon Fellowship. Worked
          on an agile team of 10 developers on infrastructure tooling.
        highlights:
          - Developed Ansible and Bash scripts to back up data across 10+ servers in Raytheon's infrastructure.
          - Presented the infrastructure solution to a Raytheon VP in a 5-minute demo.
          - Fellowship curriculum covered Linux, computer systems, containers, networking (OSI / IP / ports / routers / switches), vulnerability testing, hardware security, firewalls, IDS/IPS, web proxies, and email security.

      - company: Virginia Tech Summer Start Program
        position: Peer Mentor
        location: Blacksburg, VA
        start_date: 2023-06
        end_date: 2023-08
        highlights:
          - Supported 15+ incoming first-generation engineering students with academic guidance, study strategies, and transition coaching.
          - Ran GroupMe check-ins, one-on-one guidance, coursework and schedule support, and informal weekly community events.

    Publications:
      - title: "Retracing the Past: LLMs Emit Training Data When They Get Lost"
        authors:
          - "Myeongseob Ko"
          - "Nikhil Reddy Billa"
          - "Adam Nguyen"
          - "Charles Fleming"
          - "Ming Jin"
          - "Ruoxi Jia"
        publisher: "EMNLP 2025, Main Conference"
        releaseDate: 2025-11-01
        summary: >-
          We study a failure mode where large language models, prompted off
          their training distribution, emit verbatim training data. The paper
          characterizes when and why this happens and proposes a method that
          induces and detects it. (Contributed post-training and inference.)

      - title: "Data is All You Need (Almost): Iterative Synthetic Instruction Tuning for Secure Code Generation"
        authors:
          - "Yi Zeng"
          - "Mahavir Dabas"
          - "Tran Huynh"
          - "Nikhil Reddy"
          - "Adam Nguyen"
          - "Sanchit Kabra"
          - "Ruoxi Jia"
        publisher: "1st Proceedings of the Amazon Nova AI Challenge (Trusted AI 2025)"
        releaseDate: 2025-08-01
        summary: >-
          An end-to-end synthetic instruction-tuning pipeline (SFT + DPO) that
          trains code-generation models to produce secure code and refuse
          malicious requests, evaluated with Amazon CodeGuru and an adaptive
          LLM judge.

      - title: "Can Generalist Agents Automate Data Curation?"
        authors:
          - "Feiyang Kang"
          - "Hanze Li"
          - "Adam Nguyen"
          - "Mahavir Dabas"
          - "Jiaqi W. Ma"
          - "Frederic Sala"
          - "Dawn Song"
          - "Ruoxi Jia"
        publisher: "arXiv preprint (Curation-Bench)"
        releaseDate: 2026-06-01
        summary: >-
          Curation-Bench: a benchmark where LLM coding agents iteratively
          propose data-selection policies, fine-tune models, and revise against
          fixed training and evaluation feedback across 8 vision-language
          benchmarks.

