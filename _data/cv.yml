  summary: >-
    Incoming M.S. CS at the University of Maryland (Fall 2026) and recent
    Virginia Tech B.S. CS graduate. Research at the ReDS Lab focuses on
    data-centric AI: LLM evaluation, data curation, data valuation, and model
    safety. Co-authored two published papers (EMNLP 2025 Main Conference and
    the Amazon Nova AI Challenge proceedings) and the Curation-Bench preprint.

