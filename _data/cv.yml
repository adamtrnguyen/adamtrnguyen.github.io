      - name: Slurp — Slurm/Ray TUI for HPC job management
        summary: >-
          A TUI and CLI for managing Slurm and Ray jobs on a university HPC.
          Provides GPU monitoring, resource reporting, worker submission, job
          history, and Ray task tracking. Built to lift the ReDS Lab's
