    Publications:
      - title: "Can Generalist Agents Automate Data Curation?"
        authors:
          - "Feiyang Kang"
          - "Hanze Li"
          - "Adam Nguyen"
          - "Mahavir Dabas"
          - "Jiaqi W. Ma"
          - "Frederic Sala"
          - "Dawn Song"
