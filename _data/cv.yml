    Projects:
      - name: omni-rag — Agentic RAG MCP system over a corpus of papers and books
        highlights:
          - Built search over 1,600+ textbooks for coding agents, returning each passage with its book and page through an MCP server. Compared embedding and reranking models on a fixed set of test queries to pick the configuration.

      - name: Slurp — HPC Slurm software tooling for GPU scheduling and uv & Ray-compatible scaling
        highlights:
          - Built a tool that makes a university Slurm cluster usable as one Ray cluster, decoupling its generic uv environment from the uv environments of research projects running on it.
          - Started it when 10 students shared the lab's 12 GPUs and the lab was not using the university cluster. It makes Slurm's scheduling queue visible for planning workloads, claims GPUs as they free up, and starts Ray workers on them.
          - Scaled fine-tuning experiments from about one run to 30–90+ SFT trials per meeting, with up to 241 concurrent Ray tasks across 27 GPUs, then shared the tool with labmates.
        start_date: 2024-09
        end_date: present
